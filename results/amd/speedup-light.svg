<text x="16" y="52" font-size="13.5" fill="#52514e">Time for bump &amp; reval ÷ time for value and gradient with AD. Bump &amp; reval is estimated</text>
<text x="16" y="72" font-size="13.5" fill="#52514e">as central differences: two plain double evaluations per input plus the base value.</text>
